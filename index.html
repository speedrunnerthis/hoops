<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>54’s HOOPS</title>
<!-- Hidden until the stylesheet is loaded so there's no unstyled flash -->
<style>html{background:#0d0d12}body{visibility:hidden;margin:0}</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- LOGIN -->
<div id="auth" class="screen">
  <div class="card">
    <h1>54’s HOOPS</h1>
    <p class="sub">Create an account to save your stats</p>
    <input id="u" placeholder="Username" autocomplete="username" maxlength="20">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row">
      <button id="login">Log in</button>
      <button id="reg">Create account</button>
    </div>
    <div id="err"></div>
    <button id="guest" class="ghost">Play as guest (stats not saved)</button>
  </div>
</div>

<!-- MAIN MENU -->
<div id="menu" class="screen hide">
  <div class="card">
    <h1>54’s HOOPS</h1>
    <p class="sub" id="who"></p>
    <button id="online">Play online (queue)</button>
    <button id="bot">Play vs bot</button>
    <button id="stats">Stats</button>
    <button id="out" class="ghost">Log out</button>
    <p class="help">WASD move · Mouse look · E dribble (4 max) · Hold F shoot, release at the top · Click/R steal · Q jump/block (direction locks in air)</p>
  </div>
</div>

<!-- STATS -->
<div id="statp" class="screen hide">
  <div class="card">
    <h1>Career stats</h1>
    <div id="grid"></div>
    <button id="back">Back</button>
  </div>
</div>

<!-- QUEUE -->
<div id="queue" class="screen hide">
  <div class="card">
    <h1>Finding opponent…</h1>
    <p class="sub" id="qt">Searching the queue</p>
    <div class="spinner"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hide">
  <div id="score"><span id="s0">0</span> : <span id="s1">0</span></div>
  <div id="msg"></div>
  <div id="perfect">PERFECT</div>
  <div id="meter"><div id="fill"></div></div>
  <div id="arc">
    <svg viewBox="0 0 44 44">
      <circle class="bg" cx="22" cy="22" r="18" pathLength="100"></circle>
      <circle id="arcf" cx="22" cy="22" r="18" pathLength="100"></circle>
    </svg>
  </div>
</div>

<!-- Shown only if something fails to load -->
<div id="loaderr" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;padding:14px 18px;background:#400;color:#fff;font:14px system-ui,sans-serif"></div>

<script>
/*
  Loader. raw.githubusercontent.com serves every file as text/plain, and browsers refuse to
  run <script src> / <link rel=stylesheet> with that type. So we fetch() the text instead
  (raw.githubusercontent.com allows this) and inject it into the page ourselves.
*/
(async function () {
  var RAW = 'https://raw.githubusercontent.com/speedrunnerthis/hoops/main/';

  function fail(what, e) {
    console.error(what, e);
    var box = document.getElementById('loaderr');
    box.style.display = 'block';
    box.textContent = 'Could not load ' + what + '. If you are on a school or work device, the network may be blocking it. (' + (e && e.message || e) + ')';
    document.body.style.visibility = 'visible';
  }

  function getText(file) {
    return fetch(RAW + file).then(function (r) {
      if (!r.ok) throw new Error(file + ' returned HTTP ' + r.status);
      return r.text();
    });
  }

  // Normal external libraries (these are served with the right type, so <script src> is fine)
  function lib(src) {
    return new Promise(function (ok, bad) {
      var s = document.createElement('script');
      s.src = src; s.onload = ok;
      s.onerror = function () { bad(new Error('failed: ' + src)); };
      document.head.appendChild(s);
    });
  }

  // 1) CSS from the repo
  try {
    var css = await getText('style.css');
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
    document.body.style.visibility = 'visible';
  } catch (e) { return fail('style.css', e); }

  // 2) Libraries, in order. three.js is pinned to r128 because script.js uses outputEncoding/sRGBEncoding.
  try {
    await lib('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
    await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    // Uncomment for live play with Realtime Database:
    // await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  } catch (e) { return fail('a library (three.js / Firebase)', e); }

  // 3) Game code from the repo, run as a normal classic script
  try {
    var code = await getText('script.js');
    var sc = document.createElement('script');
    sc.textContent = code + '\n//# sourceURL=hoops/script.js';
    document.body.appendChild(sc);
  } catch (e) { return fail('script.js', e); }
})();
</script>
</body>
</html>
